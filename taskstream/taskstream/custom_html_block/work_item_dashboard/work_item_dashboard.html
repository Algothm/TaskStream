<div class="wi-dashboard" id="wi-dashboard">
  <!-- ─── Loading Skeleton ─── -->
  <div class="wi-loading" id="wi-loading">
    <div class="wi-skeleton-bar"></div>
    <div class="wi-skeleton-row"></div>
    <div class="wi-skeleton-row short"></div>
    <div class="wi-skeleton-row"></div>
    <div class="wi-skeleton-row short"></div>
  </div>

  <!-- ─── Main Content (hidden until loaded) ─── -->
  <div class="wi-content" id="wi-content" style="display:none;">

    <!-- ─── Dashboard Header (top of page.) ─── -->
    <div class="wi-header">
      <div class="wi-header-top">
        <h1 class="wi-title">My Work Items</h1>
        <!-- ─── Tab Toggle + New Button ─── -->
        <div class="wi-header-actions">
          <button class="wi-new-btn" id="wi-new-btn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span class="wi-new-btn-label">New</span>
          </button>
          <div class="wi-tabs" id="wi-tabs">
            <div class="wi-tab-indicator" id="wi-tab-indicator"></div>
            <button class="wi-tab active" data-tab="assigned">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="margin-right:6px">
                <path d="M8 7a3 3 0 100-6 3 3 0 000 6zM2 14a6 6 0 0112 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
              Assigned to Me
            </button>
            <button class="wi-tab" data-tab="byMe">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="margin-right:6px">
                <path d="M10 7a3 3 0 100-6 3 3 0 000 6zM4 14a6 6 0 0112 0M1 8h4M3 6v4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
              Assigned by Me
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ─── Summary Cards ─── -->
    <div class="wi-summary-cards" id="wi-summary-cards">
      <button class="wi-summary-card" data-status="Open">
        <span class="wi-summary-card-value" id="count-open">0</span>
        <span class="wi-summary-card-label">
          <span class="wi-card-dot" style="background:var(--c-open)"></span>Open
        </span>
      </button>
      <button class="wi-summary-card" data-status="Under Review">
        <span class="wi-summary-card-value" id="count-under-review">0</span>
        <span class="wi-summary-card-label">
          <span class="wi-card-dot" style="background:var(--c-review)"></span>Under Review
        </span>
      </button>
      <button class="wi-summary-card" data-status="On Hold">
        <span class="wi-summary-card-value" id="count-on-hold">0</span>
        <span class="wi-summary-card-label">
          <span class="wi-card-dot" style="background:var(--c-onhold)"></span>On Hold
        </span>
      </button>
      <button class="wi-summary-card" data-status="Done">
        <span class="wi-summary-card-value" id="count-done">0</span>
        <span class="wi-summary-card-label">
          <span class="wi-card-dot" style="background:var(--c-done)"></span>Done
        </span>
      </button>
      <button class="wi-summary-card wi-summary-card-accent wi-summary-card-all" data-status="All">
        <div class="wi-all-card-inner">
          <svg class="wi-all-pie" id="wi-all-pie" width="64" height="64" viewBox="0 0 64 64"></svg>
          <div class="wi-all-card-text">
            <span class="wi-summary-card-value" id="count-all">0</span>
            <span class="wi-summary-card-label">All</span>
          </div>
        </div>
      </button>
    </div>

    <!-- ─── Grouped Task List ─── -->
    <div class="wi-task-list" id="wi-task-list">
      <!-- Sections injected by JS -->
    </div>

    <!-- ─── Empty State ─── -->
    <div class="wi-empty" id="wi-empty" style="display:none;">
      <p class="wi-empty-title">No work items here</p>
      <p class="wi-empty-sub">Nothing matches the selected filter</p>
    </div>

  </div>

  <!-- ─── Row detail popup (mobile only — desktop keeps the inline expand) ─── -->
  <div class="wi-mobile-modal-backdrop" id="wi-row-modal-backdrop">
    <div class="wi-mobile-modal" id="wi-row-modal">
      <div class="wi-mobile-modal-handle"></div>
      <button class="wi-mobile-modal-close" id="wi-row-modal-close" type="button" aria-label="Close">&times;</button>
      <div class="wi-mobile-modal-body" id="wi-row-modal-body"></div>
    </div>
  </div>
</div>
